<svg viewBox="-15 0 320 70" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c"><rect x="-15" y="0" width="320" height="50"/></clipPath>
  </defs>

  <!-- Ghost large text behind -->
  <text x="-5" y="50" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif" font-size="60" font-weight="900" fill="#7c3aed" opacity="0.06" clip-path="url(#c)">OW</text>

  <!-- Main text on top -->
  <text x="-5" y="48" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif" font-size="38" font-weight="900" letter-spacing="-1">
    <tspan fill="#ffffff">OTAKU</tspan><tspan fill="#c026d3">WEEB</tspan>
  </text>

  <!-- Dot accent top-left -->
  <circle cx="-3" cy="9" r="3" fill="#e040fb"/>
  <circle cx="-3" cy="9" r="1.5" fill="#18181b"/>

  <!-- Accent lines -->
  <rect x="6" y="7" width="50" height="1.5" fill="#7c3aed" opacity="0.5"/>
  <rect x="6" y="10" width="25" height="0.75" fill="#c026d3" opacity="0.4"/>

  <!-- アニメ tag -->
  <text x="240" y="48" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif" font-size="7" font-weight="900" fill="#6b21a8" letter-spacing="1.5" opacity="0.5">アニメ</text>
</svg>