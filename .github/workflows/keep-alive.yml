name: Keep API Warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping API health endpoint
        run: |
          curl -sf --max-time 30 https://backend-delta-eight-70.vercel.app/api/health || echo "ping failed"
