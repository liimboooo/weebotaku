services:
  - type: web
    name: otaku-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      # GIF picker — set the value in the Render dashboard (Environment tab)
      - key: GIPHY_API_KEY
        sync: false
      - key: TENOR_API_KEY
        sync: false
